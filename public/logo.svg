<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lookout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F3B"/>
      <stop offset="1" stop-color="#0D1024"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C6F432" stop-opacity="0"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- radar rings -->
  <circle cx="30" cy="34" r="20" fill="none" stroke="#C6F432" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="30" cy="34" r="12" fill="none" stroke="#C6F432" stroke-opacity=".38" stroke-width="2"/>
  <!-- sweep wedge -->
  <path d="M30 34 L30 14 A20 20 0 0 1 48.4 26.2 Z" fill="url(#sweep)"/>
  <path d="M30 34 L48.4 26.2" stroke="#C6F432" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="30" cy="34" r="3.2" fill="#C6F432"/>
  <!-- the signal: a new opening, just detected -->
  <circle cx="44" cy="20" r="7" fill="#FF7A45" fill-opacity=".25"/>
  <circle cx="44" cy="20" r="4" fill="#FF7A45"/>
</svg>
